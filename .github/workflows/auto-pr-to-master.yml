name: Auto PR to master

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request to master when missing
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "master";
            const branch = context.ref.replace("refs/heads/", "");

            if (branch === base) {
              core.info("Push on master; skipping.");
              return;
            }

            const { data: existingPrs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              base,
              per_page: 1,
            });

            if (existingPrs.length > 0) {
              core.info(`Open PR already exists: #${existingPrs[0].number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head: branch,
              title: `chore: merge ${branch} into ${base}`,
              body: "PR criada automaticamente pelo workflow `auto-pr-to-master.yml`.",
            });

            core.info(`Created PR #${pr.number}`);
